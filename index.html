<script>
(() => {
'use strict';
const IMG={
 exterior:'https://cestuve.github.io/module1/BG-01.png',
 finalExterior:'https://cestuve.github.io/module1/BG-08.png',
 office:'https://cestuve.github.io/module2/Maria_Office.png',
 supervision:'https://cestuve.github.io/module4/Supervision_Room.png',
 conference:'https://cestuve.github.io/module4/Case_Conference_Room.png',
 mariaFull:'https://cestuve.github.io/module6/Maria_Fullbody.png',
 mariaHead:'https://cestuve.github.io/module6/Maria_Headshot.png',
 devonFull:'https://cestuve.github.io/module6/Devon_Fullbody.png',
 devonHead:'https://cestuve.github.io/module6/Devon_Headshot.png',
 elenaFull:'https://cestuve.github.io/module6/Elena_Fullbody.png',
 elenaHead:'https://cestuve.github.io/module6/Elena_Headshot.png',
 mei:'https://cestuve.github.io/module6/Mei_Headshot.png',
 sofia:'https://cestuve.github.io/module6/Sofia_Headshot.png',
 aaron:'https://cestuve.github.io/module6/Aaron_Headshot.png',
 walter:'https://cestuve.github.io/module6/Walter_Headshot.png',
 tasha:'https://cestuve.github.io/module6/Tasha_Headshot.png',
 treatment:'https://cestuve.github.io/module6/Treatment_Planning_Room.png',
 intake:'https://cestuve.github.io/module6/Intake_Interview_Room.png',
 resource:'https://cestuve.github.io/module6/Assessment_Resource_Room.png'
};
const sections=[
 ['Week 6','Begin Devon’s intake'],
 ['Assessment Foundations','Listen, gather, & understand'],
 ['Screening & Assessment Tools','Choose the right tool'],
 ['Building the Whole Picture','Risks, needs, & ongoing assessment'],
 ['DSM-5-TR','Understand diagnosis without exceeding scope'],
 ['ASAM Levels of Care','Match intensity to need'],
 ['Special Considerations','No assessment is one-size-fits-all'],
 ['CDCA Scope','Know your role'],
 ['Reassessment','What changes over time?'],
 ['Complete','Download your reflection PDF']
];
const state={maxSection:0,reflections:{whole:'',screening:'',context:'',reassess:''}};

function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

function showModal(html){const wasHidden=modalBackdrop.classList.contains('hidden');const panel=document.getElementById('modalPanel');if(panel)panel.classList.remove('correct','incorrect','answer-correct','answer-incorrect','has-feedback');modalContent.classList.remove('correct','incorrect','answer-correct','answer-incorrect','has-feedback');modalContent.innerHTML=html;if(wasHidden){modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');setTimeout(()=>closeModalBtn.focus(),20)}else{modalBackdrop.setAttribute('aria-hidden','false');if(panel)panel.scrollTop=0}}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true')}
closeModalBtn.addEventListener('click',closeModal);
modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalBackdrop.classList.contains('hidden'))closeModal()});
function setSection(i){state.maxSection=Math.max(state.maxSection,i);renderMenu()}
function renderMenu(){menu.innerHTML=sections.map((s,i)=>`<button class="menu-item" type="button" data-jump="${i}" ${i>state.maxSection?'disabled':''}>${i+1}. ${s[0]}<span>${s[1]}</span></button>`).join('')}

function titleIntro(){main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 6</span><h1>Assessment &amp; Diagnosis</h1><div class="intro-rule"></div><p class="intro-lead">Assessment is one of the first and most important parts of substance use disorder treatment.</p><p class="intro-copy">A good assessment does much more than determine how often someone uses a substance. It helps the treatment team understand the whole person: strengths, needs, risks, barriers, health, environment, supports, and current functioning.</p><p class="intro-copy">Assessment information can influence both the treatment plan and the level of care that may be appropriate. It is also an opportunity to listen, build trust, ask thoughtful questions, provide information, and help the client feel heard and understood.</p><p class="intro-copy">This week at Harbor Point, you’ll assist with a new intake while learning how screening, assessment, diagnosis, level-of-care decisions, and ongoing reassessment fit together.</p><div class="button-row"><button class="primary-btn" data-action="go-exterior">Return to Harbor Point →</button></div></div></section>`}

function assessmentPurpose(){showModal(`<h2>What Is Assessment Really For?</h2><div class="tool-cabinet-grid"><div class="tool-cabinet"><span class="cabinet-icon">🧭</span><h3>Guide the Treatment Plan</h3><p>Assessment information should drive planning rather than forcing every client into the same approach.</p></div><div class="tool-cabinet"><span class="cabinet-icon">🪜</span><h3>Help Determine Level of Care</h3><p>The treatment team considers how much structure, support, medical care, and treatment intensity may be appropriate.</p></div></div><h3>Build the Whole Picture</h3><div class="assessment-folder-grid"><div class="assessment-folder"><strong>💪 Strengths</strong><span>Existing abilities, resources, motivation, and supports</span></div><div class="assessment-folder"><strong>🧱 Limitations</strong><span>Factors that may affect participation, functioning, or comprehension</span></div><div class="assessment-folder"><strong>🎯 Needs</strong><span>Services, supports, education, evaluation, and treatment needs</span></div><div class="assessment-folder"><strong>⚠️ Risks &amp; Barriers</strong><span>Safety concerns and obstacles that may interfere with care</span></div></div><p>The American Society of Addiction Medicine (<a class="resource-link" href="https://www.asam.org/asam-criteria/implementation-tools/criteria-intake-assessment-form" target="_blank" rel="noopener">ASAM</a>) describes assessment as drawing from the client’s biopsychosocial dimensions. Another way to think about assessment is as a systematic process of interacting with a person, observing and eliciting information, and assembling what is relevant to the person’s situation now and in the foreseeable future.</p><p>In addition to collecting information, the provider should offer information and education when needed.</p><div class="button-row center"><button class="primary-btn" data-action="resource-scene">Choose the Right Assessment Tools →</button></div>`) }

function screenCabinet(){showModal(`<h2>Screening Tool Cabinet</h2><p>Below are several screening tools available for CDCAs to use.</p><div class="tool-grid"><div class="tool-card"><strong>CAGE / CAGE-AID</strong><span>Four-question tool; CAGE focuses on alcohol; CAGE-AID incorporates drug use</span><a class="resource-link" href="https://americanaddictioncenters.org/alcohol/rehab-treatment/cage-questionnaire-assessment" target="_blank" rel="noopener">Learn More ↗</a></div><div class="tool-card"><strong>AUDIT</strong><span><a class="resource-link" href="https://www.who.int/" target="_blank" rel="noopener">WHO</a>-developed Alcohol Use Disorders Identification Test (AUDIT) assesses alcohol consumption, drinking behaviors, and alcohol-related problems</span><a class="resource-link" href="https://nida.nih.gov/sites/default/files/files/AUDIT.pdf" target="_blank" rel="noopener">Learn More ↗</a></div><div class="tool-card"><strong>DAST</strong><span>The Drug Abuse Screening Test (DAST) screens for drug-use problems rather than alcohol</span><a class="resource-link" href="https://sbirt.care/pdfs/tools/DAST.PDF" target="_blank" rel="noopener">Learn More ↗</a></div><div class="tool-card"><strong>ASSIST</strong><span><a class="resource-link" href="https://www.who.int/" target="_blank" rel="noopener">WHO</a>-developed Alcohol, Smoking and Substance Involvement Screening Test (ASSIST) to cover a range of substances</span><a class="resource-link" href="https://nida.nih.gov/sites/default/files/pdf/nmassist.pdf" target="_blank" rel="noopener">Learn More ↗</a></div><div class="tool-card"><strong>TAPS</strong><span>Tobacco, Alcohol, Prescription Medication, and Other Substance Use (TAPS) tool designed for quick screening and assessment in primary care</span><a class="resource-link" href="https://nida.nih.gov/taps2/" target="_blank" rel="noopener">Learn More ↗</a></div><div class="tool-card"><strong>CRAFFT</strong><span>Substance-use risk screening designed for adolescents</span><a class="resource-link" href="https://crafft.org/about-the-crafft/" target="_blank" rel="noopener">Learn More ↗</a></div><div class="tool-card"><strong>SBIRT</strong><span>Screening, Brief Intervention, and Referral to Treatment (SBIRT) is an early-intervention approach used especially in medical settings</span><a class="resource-link" href="https://www.samhsa.gov/substance-use/treatment/sbirt" target="_blank" rel="noopener">Learn More ↗</a></div></div><div class="button-row center"><button class="primary-btn" data-action="screen-challenge" data-i="0">Try the Screening Tool Challenge →</button></div>`) }

abel>`).join('')}</div><div class="button-row center"><button class="primary-btn" type="button" data-action="check-chart">Check My Thinking →</button></div><div class="inline-question-feedback" aria-live="polite"></div></div>`)}

function asamIntro(){showModal(`<h2>The ASAM Continuum of Care</h2>${headQuote(IMG.mariaHead,'Maria','“Not everyone who needs help needs the same kind of treatment. The ASAM Levels of Care describes a continuum from early intervention to highly intensive medically managed care.”')}<div class="m6-table-wrap"><table class="m6-table asam-table"><thead><tr><th>Level</th><th>Who / When</th><th>Structure</th><th>Focus / Services</th></tr></thead><tbody><tr><td>0.5</td><td>Individuals at risk of developing substance use disorder who do not yet meet diagnostic criteria</td><td>Early intervention</td><td>Education on substance use; brief interventions; motivational interviewing; SBIRT</td></tr><tr><td>1</td><td>Individuals with mild substance use disorder or people transitioning from higher levels</td><td>Fewer than 9 hours/week for adults; fewer than 6 hours/week for adolescents</td><td>Relapse prevention; education; individual/group counseling</td></tr><tr><td>2.1</td><td>Individuals needing intensive outpatient treatment</td><td>9+ hours/week for adults; 6+ hours/week for adolescents</td><td>Structured therapy; step-down from inpatient or step-up from outpatient</td></tr><tr><td>2.5</td><td>Individuals needing partial hospitalization</td><td>20+ hours/week</td><td>Medical monitoring, but not 24/7; more intensive therapy and support</td></tr><tr><td>3.1</td><td>Clinically managed low-intensity residential care</td><td>Structured, live-in setting with 24-hour supportive care</td><td>Recovery skills; community living; psychoeducation; relapse prevention; emotional coping; reintegration into home, school, work, and community</td></tr><tr><td>3.3</td><td>Individuals with cognitive impairments or chronic mental health needs</td><td>Population-specific high-intensity residential care</td><td>Slower-paced care and repetition to support comprehension and coping</td></tr><tr><td>3.5</td><td>Individuals with multiple needs, such as co-occurring disorders or unstable housing, sometimes with severe social and psychological conditions</td><td>Clinically managed high-intensity residential care</td><td>Structured, intensive treatment</td></tr><tr><td>3.7</td><td>Individuals with serious medical, emotional, or behavioral issues</td><td>24/7 nursing care with medical oversight</td><td>Medically monitored high-intensity inpatient care</td></tr><tr><td>4</td><td>Individuals with severe withdrawal symptoms, medical instability, or acute psychiatric issues</td><td>24/7 medical and psychiatric care with daily direct physician care; typically hospital or inpatient-detox based</td><td>Medically managed intensive inpatient treatment</td></tr></tbody></table></div><div class="button-row center"><button class="primary-btn" data-action="asam-challenge" data-i="0">Try the Level-of-Care Challenge →</button></div>`) }

function considerations(){showModal(`<h2>Ten Areas That Can Change How We Assess</h2><p>Select each area for the key considerations from this module.</p><div class="consideration-list"><details><summary>1. Cultural and Socioeconomic Factors</summary><ul><li>Cultural norms can influence perceptions of substance use and willingness to disclose.</li><li>Language barriers can affect comprehension of assessment tools.</li><li>Consider acculturation, stigma, and historical trauma, including the impact of historical trauma in Indigenous populations.</li><li>Be mindful of bias, including assumptions about criminality or dysfunction based on race or ethnicity.</li></ul></details><details><summary>2. Co-Occurring Disorders</summary><ul><li>Many people with substance use disorder also experience mental-health disorders such as depression, anxiety, PTSD, or bipolar disorder.</li><li>Symptoms can overlap, including anxiety versus withdrawal.</li><li>Use integrated assessment and consider order of onset.</li></ul></details><details><summary>3. Stage of Change / Readiness for Treatment</summary><ul><li>Not everyone presenting with substance use disorder is ready for treatment.</li><li>SOCRATES or URICA may be used to assess motivation/readiness; these will be covered more later.</li><li>Tailor interventions accordingly, such as motivational interviewing for people in precontemplation.</li></ul></details><details><summary>4. Substance-Specific Considerations</summary><ul><li>Effects, withdrawal, and patterns vary by substance.</li><li>Stimulants may complicate depression/anxiety presentation.</li><li>With opioids, consider physical dependence versus addiction.</li><li>Alcohol is legal but can be highly addictive.</li><li>Polysubstance use may complicate diagnosis.</li></ul></details><details><summary>5. Trauma History</summary><ul><li>Trauma is common among people with substance use disorder.</li><li>It may be a cause, consequence, or compounding factor.</li><li>Use trauma-informed assessment to avoid re-traumatization.</li><li>Ask carefully and respectfully; validated tools such as the ACE questionnaire may be relevant.</li></ul></details><details><summary>6. Cognitive Functioning</summary><ul><li>Long-term substance use can impair memory, attention, and executive functioning.</li><li>Neurocognitive assessment may be necessary in some cases.</li><li>Adjust interview pace and question complexity.</li></ul></details><details><summary>7. Developmental Stage</summary><ul><li>Adolescents may use for different reasons, including peer pressure and identity formation.</li><li>Use age-appropriate tools such as CRAFFT.</li><li>Consider parental involvement and confidentiality requirements.</li></ul></details><details><summary>8. Legal and Ethical Issues</summary><ul><li>Be aware of applicable mandatory-reporting requirements and agency policy.</li><li>Assessments may occur in forensic or correctional settings and may be court mandated.</li><li>Informed consent and confidentiality remain critical, including in mandated assessments.</li></ul></details><details><summary>9. Physical Health and Medical Considerations</summary><ul><li>Chronic health conditions may be worsened by substance use.</li><li>Symptoms such as fatigue or weight loss can also reflect physical illness.</li><li>Consider infectious-disease screening such as HIV or hepatitis C when relevant, particularly with injection drug use.</li><li>Consider disability, gender, age, sexual orientation, and pregnancy when relevant to the person’s health and care.</li></ul></details><details><summary>10. Environmental and Social Context</summary><ul><li>Assess housing, employment, education, social support, and recovery capital.</li><li>Consider access to substances and community norms.</li><li>Consider urban, suburban, or rural setting and whether the person is unhoused.</li><li>Consider childcare responsibilities and pregnancy.</li><li>Consider criminal-justice issues such as incarceration, parole/probation, or DWI offenses.</li></ul></details></div><div class="button-row center"><button class="primary-btn" data-action="reflection3">Complete the Whole-Person Reflection →</button></div>`)}
